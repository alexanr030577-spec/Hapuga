name: Build Hapuga APK
on:
  push:
    branches: [ main, zone-filter-v010 ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Keep debug signing key stable
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hapuga-debug-keystore-v1
      - run: gradle assembleDebug
      - name: Prepare garage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Hapuga-latest.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hapuga-debug-apk
          path: Hapuga-latest.apk
      - name: Publish to permanent garage
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view garage >/dev/null 2>&1 || gh release create garage --title "Hapuga Garage" --notes "Always-current test APK."
          gh release upload garage Hapuga-latest.apk --clobber
